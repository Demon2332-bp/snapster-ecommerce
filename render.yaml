services:
  - type: web
    name: snapster
    runtime: node
    plan: starter
    branch: security/production-hardening
    buildCommand: npm install && npm run lint && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.12.0
      - key: FIREBASE_DATABASE_ID
        value: ai-studio-snapsterpremiums-0f0a31f1-c628-41c1-894b-f705f1af7340
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        generateValue: true
